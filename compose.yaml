# Voxie, all of it: the voice server, the GPU voice router and the quickstart.
#
#   cp .env.example .env    # add your keys
#   docker compose up --build             # Linux (Docker Engine)
#   docker compose up -d --build voice-router   # Docker Desktop: see README
#   open http://localhost:8400
#
# The server and quickstart use host networking: WebRTC media needs the
# server reachable on UDP, and publishing thousands of UDP ports through
# Docker's proxy is slow (the upstream EC2 deployment does the same). On
# Docker Desktop (Windows, WSL2, macOS) "host" is Docker's VM, not your
# machine, so run those two natively; the voice router works everywhere.
services:
  voxie:
    build: .
    network_mode: host
    env_file: .env
    volumes:
      - ./configs/voxie.toml:/config.toml:ro
    restart: unless-stopped

  voice-router:
    build: voice-router
    # Plain HTTP, so published ports work everywhere, Docker Desktop included.
    ports:
      - "8300:8300"
    env_file: .env
    command: ["--voice", "${VOXIE_VOICE:-${VOXIE_VOICE_GENDER:-female}}", "--default-voice", "${VOXIE_ENGLISH_VOICE:-}"]
    volumes:
      # Kokoro's weights. A named volume by default; set VOXIE_HF_CACHE to a
      # host directory to share an existing Hugging Face cache instead.
      - ${VOXIE_HF_CACHE:-hf-cache}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  quickstart:
    image: node:22-alpine
    network_mode: host
    env_file: .env
    working_dir: /app
    volumes:
      - ./examples/quickstart:/app:ro
    command: ["node", "server.mjs"]
    depends_on: [voxie]

volumes:
  hf-cache:
